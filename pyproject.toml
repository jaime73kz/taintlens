[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taintlens"
version = "1.0.0"
description = "Análisis estático de flujo de datos (taint analysis) para Python, con soporte para aplicaciones con IA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaime Sánchez Vicente" }]
keywords = ["seguridad", "análisis estático", "taint analysis", "SARIF", "python", "sast"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
bench = ["bandit>=1.7"]

[project.scripts]
taintlens = "taintlens.cli:main"

[project.urls]
Repository = "https://github.com/jaime73kz/taintlens"

[tool.setuptools]
packages = ["taintlens"]
